version: '3.8'

services:
  # ============================================================================
  # 1. API GATEWAY (Single Public Ingress Point)
  # ============================================================================
  api-gateway:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        SERVICE: gateway-service
    container_name: clinic_api_gateway
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - AUTH_SERVICE_URL=http://auth-service:9001
      - CATALOG_SERVICE_URL=http://catalog-service:9002
      - BOOKING_SERVICE_URL=http://booking-service:9003
      - PAYMENT_SERVICE_URL=http://payment-service:9004
      - MEDICAL_SERVICE_URL=http://medical-service:9005
      - FRONTEND_STATIC_DIR=/app/dist
      - SECRET_KEY=${SECRET_KEY:-clinic-super-secret-key-change-in-production-2026}
    depends_on:
      - auth-service
      - catalog-service
      - booking-service
      - payment-service
      - medical-service
    restart: unless-stopped
    networks:
      - clinic-network

  # ============================================================================
  # 2. DOMAIN MICROSERVICES (Private Network Only)
  # ============================================================================
  auth-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        SERVICE: auth-service
    container_name: clinic_auth_service
    environment:
      - PORT=9001
      - DATABASE_URL=postgres://postgres:Quockhanh208@@postgres:5432/clinic?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-clinic-super-secret-key-change-in-production-2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - clinic-network

  catalog-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        SERVICE: catalog-service
    container_name: clinic_catalog_service
    environment:
      - PORT=9002
      - DATABASE_URL=postgres://postgres:Quockhanh208@@postgres:5432/clinic?sslmode=disable
      - SECRET_KEY=${SECRET_KEY:-clinic-super-secret-key-change-in-production-2026}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - clinic-network

  booking-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        SERVICE: booking-service
    container_name: clinic_booking_service
    environment:
      - PORT=9003
      - DATABASE_URL=postgres://postgres:Quockhanh208@@postgres:5432/clinic?sslmode=disable
      - REDIS_URL=redis://redis:6379/0
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - SECRET_KEY=${SECRET_KEY:-clinic-super-secret-key-change-in-production-2026}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - clinic-network

  payment-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        SERVICE: payment-service
    container_name: clinic_payment_service
    environment:
      - PORT=9004
      - DATABASE_URL=postgres://postgres:Quockhanh208@@postgres:5432/clinic?sslmode=disable
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672/
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - FRONTEND_URL=http://localhost:8080
      - SECRET_KEY=${SECRET_KEY:-clinic-super-secret-key-change-in-production-2026}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - clinic-network

  medical-service:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
      args:
        SERVICE: medical-service
    container_name: clinic_medical_service
    environment:
      - PORT=9005
      - DATABASE_URL=postgres://postgres:Quockhanh208@@postgres:5432/clinic?sslmode=disable
      - SECRET_KEY=${SECRET_KEY:-clinic-super-secret-key-change-in-production-2026}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - clinic-network

  # ============================================================================
  # 3. FRONTEND UI (Dev Server with Hot Reload)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: clinic_ui
    ports:
      - "3000:3000"
    working_dir: /app
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - HOST=0.0.0.0
      - VITE_API_BASE_URL=http://localhost:8080/api
    command: npm run dev
    restart: unless-stopped
    networks:
      - clinic-network

  # ============================================================================
  # 4. STORAGE & MESSAGING INFRASTRUCTURE
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: clinic_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Quockhanh208@
      POSTGRES_DB: clinic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/internal/infrastructure/db/create-database.sql:/docker-entrypoint-initdb.d/create-database.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinic"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - clinic-network

  redis:
    image: redis:7-alpine
    container_name: clinic_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - clinic-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: clinic_rabbitmq
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clinic-network

networks:
  clinic-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
