apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "clinic.fullname" . }}-config
  labels:
    {{- include "clinic.labels" . | nindent 4 }}
data:
  POSTGRES_HOST: {{ .Values.config.postgresHost | quote }}
  POSTGRES_PORT: {{ .Values.config.postgresPort | quote }}
  POSTGRES_USER: {{ .Values.config.postgresUser | quote }}
  POSTGRES_DB: {{ .Values.config.postgresDatabase | quote }}
  POSTGRES_SSLMODE: {{ .Values.config.postgresSslMode | quote }}
  REDIS_HOST: {{ .Values.config.redisHost | quote }}
  REDIS_PORT: {{ .Values.config.redisPort | quote }}
  RABBITMQ_HOST: {{ .Values.config.rabbitmqHost | quote }}
  RABBITMQ_PORT: {{ .Values.config.rabbitmqPort | quote }}
  AUTH_SERVICE_URL: "http://auth-service:9001"
  CATALOG_SERVICE_URL: "http://catalog-service:9002"
  BOOKING_SERVICE_URL: "http://booking-service:9003"
  PAYMENT_SERVICE_URL: "http://payment-service:9004"
  MEDICAL_SERVICE_URL: "http://medical-service:9005"
