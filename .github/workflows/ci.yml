name: Microservices CI

on:
  push:
    branches: [ main, feat/*, feature/* ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test-and-build:
    name: Backend Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go 1.24
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Install dependencies
        working-directory: ./backend
        run: go mod download

      - name: Run Go Unit Tests
        working-directory: ./backend
        run: go test -v ./internal/... ./pkg/...

      - name: Build All Microservices Binaries
        working-directory: ./backend
        run: |
          go build -o /dev/null ./cmd/gateway-service/main.go
          go build -o /dev/null ./cmd/auth-service/main.go
          go build -o /dev/null ./cmd/catalog-service/main.go
          go build -o /dev/null ./cmd/booking-service/main.go
          go build -o /dev/null ./cmd/payment-service/main.go
          go build -o /dev/null ./cmd/medical-service/main.go

  docker-compose-validation:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose -f docker-compose.microservices.yml config
